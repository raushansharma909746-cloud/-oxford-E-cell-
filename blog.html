<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ब्लॉग और PPT लिस्ट</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            padding: 16px;
            color: #333;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            color: #1a202c;
        }

        .blog-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 500px;
            margin: 0 auto;
        }

        .blog-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .blog-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #2d3748;
        }

        .blog-card p {
            font-size: 13px;
            color: #718096;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-video {
            background-color: #e53e3e;
            color: #ffffff;
        }

        .btn-ppt {
            background-color: #3182ce;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1 class="header-title">लेटेस्ट ब्लॉग व PPT</h1>

    <div class="blog-container">

        <!-- नया ब्लॉग जोड़ने के लिए इस पूरे ब्लॉक को कॉपी-पेस्ट करें -->
        <div class="blog-card">
            <h3>ब्लॉग 1: टॉपिक का नाम</h3>
            <p>यहाँ ब्लॉग या वीडियो के बारे में संक्षिप्त जानकारी लिखें।</p>
            <div class="btn-group">
                <a href="https://youtube.com/YOUR_VIDEO_URL_1" target="_blank" class="btn btn-video">वीडियो देखें</a>
                <a href="https://drive.google.com/YOUR_PPT_URL_1" target="_blank" class="btn btn-ppt">PPT खोलें</a>
            </div>
        </div>

        <!-- दूसरा ब्लॉग -->
        <div class="blog-card">
            <h3>ब्लॉग 2: टॉपिक का नाम</h3>
            <p>यहाँ ब्लॉग या वीडियो के बारे में संक्षिप्त जानकारी लिखें।</p>
            <div class="btn-group">
                <a href="https://youtube.com/YOUR_VIDEO_URL_2" target="_blank" class="btn btn-video">वीडियो देखें</a>
                <a href="https://drive.google.com/YOUR_PPT_URL_2" target="_blank" class="btn btn-ppt">PPT खोलें</a>
            </div>
        </div>

    </div>

</body>
</html>
